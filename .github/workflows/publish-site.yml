name: Publish AI Workbench site

on:
  push:
    branches: [main]
    paths:
      - 'source.part0*'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reassemble source
        run: |
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.part05 source.part06 > source.tar.xz.b64
          base64 --decode source.tar.xz.b64 | tar -xJf -
          test -f ai-workbench/package.json
          test ! -e ai-workbench/.env
          python3 - <<'PY'
          from pathlib import Path
          app = Path("ai-workbench/src/App.tsx")
          source = app.read_text()
          start = source.index("  useEffect(() => {\n    if (!supabase) {")
          end = source.index("\n  }, []);", start) + len("\n  }, []);")
          block = source[start:end]
          block = block.replace("  useEffect(() => {\n    if (!supabase) {", "  useEffect(() => {\n    const client = supabase;\n    if (!client) {", 1)
          block = block.replace("supabase.auth.", "client.auth.")
          app.write_text(source[:start] + block + source[end:])
          Path("ai-workbench/src/vite-env.d.ts").write_text('/// <reference types="vite/client" />\n')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build website
        working-directory: ai-workbench
        run: |
          npm install --no-audit --no-fund
          npm run build
        env:
          VITE_SUPABASE_URL: https://zmwgrlvgzcxmepfnltal.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_K2bal_OIfSiXjRqygUyjgw_HJJx5f4y

      - name: Publish built site to GitHub Pages branch
        run: |
          cp -a ai-workbench/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets icons manifest.webmanifest sw.js .nojekyll
          if git diff --cached --quiet; then
            echo "The published website is already up to date."
          else
            git commit -m "Publish AI Workbench web app"
            git push origin HEAD:main
          fi
